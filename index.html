<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Risk Insights Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    /* ── Design tokens (dark+gold, single theme) ── */
    :root {
      --bg:#0a0806;
      --bg-2:#0f0c08;
      --surface:#14100a;
      --surface-2:#1a150d;
      --surface-3:#221b10;
      --border:#2e2617;
      --border-2:#40351f;
      --fg:#f6f2e8;
      --fg-muted:#c4b79b;
      --fg-dim:#897c64;
      --gold:#e8c810;
      --gold-2:#f5da3a;
      --gold-deep:#c99a1e;
      --cream:#cdbf9f;
      --soon:#a89572;
      --live:#34d399;
      --ring:#e8c810;
      --radius:14px;
      --radius-lg:20px;
      --maxw:1140px;
      --ease:cubic-bezier(0.22,1,0.36,1);
      --font:"Fira Sans","Segoe UI",system-ui,sans-serif;
      --mono:"Fira Code",ui-monospace,Consolas,monospace;
    }

    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 14px; }

    body {
      font-family: var(--font);
      background:
        radial-gradient(900px 480px at 15% -8%, rgba(232,200,16,0.11), transparent 60%),
        radial-gradient(760px 460px at 100% 0%, rgba(245,218,58,0.06), transparent 55%),
        var(--bg);
      color: var(--fg);
      line-height: 1.5;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        linear-gradient(to right, rgba(232,200,16,0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(232,200,16,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(1200px 700px at 50% 0%, #000 30%, transparent 85%);
      -webkit-mask-image: radial-gradient(1200px 700px at 50% 0%, #000 30%, transparent 85%);
      pointer-events: none;
      z-index: 0;
    }

    /* ensure content is above grid overlay */
    #header, #main { position: relative; z-index: 1; }

    /* ── Focus visible ── */
    :focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* ── Header bar ── */
    #header {
      background: rgba(20,16,10,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    #app-title {
      font-family: var(--mono);
      font-weight: 700;
      font-size: 1rem;
      color: var(--gold);
      white-space: nowrap;
      letter-spacing: -0.02em;
      margin-right: 8px;
      flex-shrink: 0;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-width: 120px;
    }

    .input-group label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--fg-dim);
    }

    .input-group input {
      height: 44px;
      min-height: 44px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--cream);
      font-family: var(--font);
      font-size: 0.85rem;
      transition: border-color 150ms var(--ease), box-shadow 150ms var(--ease);
    }

    .input-group input:hover {
      border-color: var(--border-2);
    }

    .input-group input:focus {
      border-color: var(--ring);
      box-shadow: 0 0 0 2px var(--ring);
      outline: none;
    }

    .input-group input[readonly] {
      color: var(--fg-dim);
      opacity: 0.7;
      cursor: default;
    }

    #fetchBtn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 22px;
      height: 44px;
      min-height: 44px;
      min-width: 100px;
      background: linear-gradient(180deg, var(--gold-2), var(--gold));
      color: #0a0806;
      border: none;
      border-radius: 10px;
      font-family: var(--font);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: filter 150ms var(--ease), transform 100ms, box-shadow 150ms var(--ease);
      flex-shrink: 0;
      white-space: nowrap;
    }

    #fetchBtn:hover:not(:disabled) {
      filter: brightness(1.1);
      box-shadow: 0 4px 16px rgba(232,200,16,0.35);
    }

    #fetchBtn:active:not(:disabled) {
      transform: translateY(1px);
    }

    #fetchBtn:focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 2px;
    }

    #fetchBtn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(10,8,6,0.3);
      border-top-color: #0a0806;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Status pill ── */
    #status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 500;
      white-space: nowrap;
      max-width: 420px;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--fg-dim);
      background: transparent;
      transition: background 200ms var(--ease), color 200ms var(--ease);
    }

    #status.fetching {
      color: var(--gold);
    }

    #status.loaded {
      color: var(--live);
    }

    #status.loaded::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--live);
      flex-shrink: 0;
    }

    #status.error {
      color: #f0736a;
      background: rgba(240,115,106,0.1);
      border-radius: 999px;
    }

    /* ── Main layout ── */
    #main {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── Zone filter / tab strip ── */
    #zones-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset, 0 8px 24px rgba(0,0,0,0.45);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      transition: border-color 150ms var(--ease);
    }

    #zones-panel:hover {
      border-color: var(--border-2);
    }

    #zones {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      flex: 1;
    }

    .zone-btn {
      height: 44px;
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--fg-muted);
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 150ms var(--ease), color 150ms var(--ease), border-color 150ms var(--ease), box-shadow 150ms var(--ease);
      min-width: 44px;
      white-space: nowrap;
    }

    .zone-btn:hover {
      border-color: var(--border-2);
      color: var(--fg);
      background: var(--surface-3);
    }

    .zone-btn[aria-selected="true"] {
      background: linear-gradient(180deg, var(--gold-2), var(--gold));
      color: #0a0806;
      border-color: transparent;
      font-weight: 700;
      box-shadow: 0 2px 10px rgba(232,200,16,0.3);
    }

    /* ── Screenshot button (secondary style) ── */
    #screenshotBtn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 16px;
      height: 44px;
      min-height: 44px;
      background: var(--surface-2);
      color: var(--gold);
      border: 1px solid var(--gold-deep);
      border-radius: 10px;
      font-family: var(--font);
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 150ms var(--ease), box-shadow 150ms var(--ease), opacity 150ms;
      white-space: nowrap;
      flex-shrink: 0;
    }

    #screenshotBtn:hover:not(:disabled) {
      background: var(--surface-3);
      box-shadow: 0 2px 10px rgba(232,200,16,0.2);
    }

    #screenshotBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ── Empty state ── */
    #empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 64px 24px;
      text-align: center;
      color: var(--fg-dim);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    #empty .empty-icon {
      opacity: 0.3;
      color: var(--gold);
    }

    #empty h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--fg-muted);
    }

    #empty p {
      font-size: 0.9rem;
      max-width: 360px;
      color: var(--fg-dim);
    }

    #empty strong {
      color: var(--cream);
    }

    /* ── Insights container ── */
    #insights {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── Zone heading (for screenshot context) ── */
    #zone-heading {
      font-family: var(--mono);
      font-size: 1rem;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 0.02em;
      padding: 4px 0 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }

    /* ── Panel (wraps each insight element) ── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset, 0 8px 24px rgba(0,0,0,0.45);
      overflow: hidden;
      transition: border-color 200ms var(--ease);
    }

    .panel:hover {
      border-color: var(--border-2);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 0;
    }

    .panel-title {
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--fg-dim);
    }

    .panel-toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tool-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--cream);
      cursor: pointer;
      transition: color 150ms var(--ease), border-color 150ms var(--ease), background 150ms var(--ease);
      flex-shrink: 0;
      padding: 0;
    }

    .tool-btn:hover {
      color: var(--gold);
      border-color: var(--border-2);
      background: var(--surface-3);
    }

    .tool-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .panel-body {
      padding: 12px 16px 16px;
    }

    /* ── KPI cards ── */
    #kpis-wrap {
      /* panel wrapping kpis grid */
    }

    #kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .kpi-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      border-top: 3px solid var(--gold-deep);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: border-color 150ms var(--ease);
    }

    .kpi-card:hover {
      border-color: var(--border-2);
      border-top-color: var(--gold);
    }

    .kpi-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--fg-muted);
    }

    .kpi-value {
      font-family: var(--mono);
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--gold);
      line-height: 1.1;
    }

    .kpi-sub {
      font-size: 0.78rem;
      color: var(--fg-muted);
      font-weight: 400;
      margin-top: 2px;
    }

    /* ── Chart row ── */
    .chart-row {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 16px;
    }

    .chart-container {
      position: relative;
      width: 100%;
    }

    #pie-container {
      height: 280px;
    }

    #bar-container {
      height: 280px;
    }

    /* ── Narrative ── */
    #narrative {
      font-size: 0.88rem;
      line-height: 1.6;
      color: var(--cream);
    }

    .narrative-line {
      display: block;
    }

    .narrative-line.domain-line {
      color: var(--gold-deep);
      font-weight: 600;
      margin-top: 4px;
    }

    .narrative-blank {
      display: block;
      height: 0.75em;
    }

    /* ── Table ── */
    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    #table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      font-variant-numeric: tabular-nums;
    }

    #table thead {
      position: sticky;
      top: 0;
      z-index: 2;
    }

    #table th {
      background: var(--surface-2);
      color: var(--cream);
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 8px 12px;
      text-align: right;
      white-space: nowrap;
      border-bottom: 2px solid var(--border);
      cursor: pointer;
      user-select: none;
      position: relative;
      transition: background 150ms var(--ease);
    }

    #table th:first-child {
      text-align: left;
    }

    #table th:hover {
      background: var(--surface-3);
    }

    #table th.sort-active {
      color: var(--gold);
    }

    .sort-indicator {
      display: inline-block;
      margin-left: 4px;
      opacity: 0.5;
      font-size: 0.65rem;
    }

    #table th.sort-active .sort-indicator {
      opacity: 1;
      color: var(--gold);
    }

    #table td {
      padding: 8px 12px;
      text-align: right;
      border-bottom: 1px solid var(--border);
      color: var(--fg-muted);
      white-space: nowrap;
    }

    #table td:first-child {
      text-align: left;
      font-weight: 500;
      color: var(--cream);
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #table tr:last-child td {
      border-bottom: none;
    }

    #table tbody tr:nth-child(even) td {
      background: rgba(255,255,255,0.02);
    }

    #table tbody tr:hover td {
      background: rgba(232,200,16,0.06);
    }

    #table td.total-col {
      font-family: var(--mono);
      font-weight: 700;
      color: var(--gold);
    }

    #table th.total-col {
      color: var(--gold);
    }

    /* ── Toast ── */
    #toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      background: var(--surface-2);
      border: 1px solid var(--gold-deep);
      border-radius: 10px;
      color: var(--cream);
      font-size: 0.82rem;
      padding: 10px 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      animation: toast-in 200ms var(--ease) both;
      pointer-events: none;
      max-width: 280px;
    }

    .toast.toast-out {
      animation: toast-out 200ms var(--ease) both;
    }

    @keyframes toast-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes toast-out {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(8px); }
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      #header {
        padding: 8px 12px;
        gap: 8px;
      }

      #app-title {
        font-size: 0.9rem;
        width: 100%;
      }

      .input-group {
        min-width: 100px;
      }

      #main {
        padding: 12px;
        gap: 12px;
      }

      .chart-row {
        grid-template-columns: 1fr;
      }

      #kpis {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 480px) {
      #kpis {
        grid-template-columns: 1fr;
      }

      .input-group {
        flex: 1 1 calc(50% - 8px);
      }
    }

    @media (min-width: 1024px) {
      .chart-row {
        grid-template-columns: 1fr 2.2fr;
      }
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    /* ── Table panel: allow sticky thead (overflow:hidden disables sticky) ── */
    #table-panel { overflow: visible; }

    /* ── Utility ── */
    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- ── Header ── -->
<header id="header">
  <span id="app-title">Risk Insights</span>

  <div class="input-group">
    <label for="hostname">Hostname</label>
    <input type="text" id="hostname" placeholder="tenant.onetrust.com" autocomplete="off" spellcheck="false">
  </div>

  <div class="input-group">
    <label for="clientId">Client ID</label>
    <input type="text" id="clientId" autocomplete="off" spellcheck="false">
  </div>

  <div class="input-group">
    <label for="clientSecret">Client Secret</label>
    <input type="password" id="clientSecret" autocomplete="new-password">
  </div>

  <div class="input-group" style="max-width:220px;">
    <label for="view">View</label>
    <input type="text" id="view" value="TPRM Global View" readonly aria-readonly="true">
  </div>

  <button id="fetchBtn" type="button">
    <svg id="fetchIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
    Fetch
  </button>

  <span id="status" role="status" aria-live="polite" aria-atomic="true">Idle</span>
</header>

<!-- ── Toast container ── -->
<div id="toast-container" aria-live="polite" aria-atomic="false"></div>

<!-- ── Main ── -->
<main id="main">

  <!-- Zone filter + screenshot button -->
  <div id="zones-panel">
    <div id="zones" role="tablist" aria-label="Zone filter"></div>
    <button id="screenshotBtn" type="button" title="Download zone image" aria-label="Download zone image">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Download zone image
    </button>
  </div>

  <!-- Empty state -->
  <div id="empty">
    <svg class="empty-icon" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
    </svg>
    <h2>No data loaded</h2>
    <p>Enter your OneTrust credentials and click <strong>Fetch</strong> to load risk insights.</p>
  </div>

  <!-- Insights (hidden until data loaded) -->
  <div id="insights" class="hidden">

    <!-- Zone heading (visible in screenshots) -->
    <div id="zone-heading"></div>

    <!-- Panel 1: KPI cards -->
    <div class="panel" id="kpis-wrap">
      <div class="panel-header">
        <div class="panel-title">Key Metrics</div>
        <div class="panel-toolbar">
          <button class="tool-btn" id="kpisCopyBtn" type="button" aria-label="Copy KPI summary" title="Copy KPI summary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

            <button class="tool-btn" id="pieDownloadBtn" type="button" aria-label="Download pie chart as PNG" title="Download pie chart as PNG">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

      <!-- Panel 3: Stacked bar chart -->

              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
            </button>
            <button class="tool-btn" id="barDownloadBtn" type="button" aria-label="Download bar chart as PNG" title="Download bar chart as PNG">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>

  </div><!-- #insights -->

</main>

<script>
(function () {
  'use strict';

  // ── State ──────────────────────────────────────────────────────────────────
  var payload = null;
  var currentZone = 'Overall';
  var pieChart = null;
  var barChart = null;
  var sortCol = null;
  var sortAsc = true;

  var ZONE_ORDER = ['GHQ', 'AFR', 'SAZ', 'MAZ', 'NAZ', 'APAC', 'EUR', 'BEES', 'BEES-FT', 'Overall'];

  // ── Chart palette (gold/amber tones suitable for dark bg) ──────────────────
  var CAT_COLORS = {
    'COMMERCIAL': '#e8c810',
    'LOGISTICS':  '#c99a1e',
    'NCI':        '#f5da3a',
    'PACKAGING':  '#a89572',
    'TECHNOLOGY': '#cdbf9f',
    'RAU':        '#897c64',
    'Fees':       '#40351f',
  };

  var PIE_PALETTE = [
    '#e8c810','#c99a1e','#f5da3a','#a89572','#cdbf9f',
    '#897c64','#5a4e3a','#40351f','#d4a820','#b8922a',
    '#f0d060','#9a8060','#7a6040','#e0b830','#c0a020',
  ];

  // ── Elements ───────────────────────────────────────────────────────────────
  var $ = function(id) { return document.getElementById(id); };
  var elStatus    = $('status');
  var elZones     = $('zones');
  var elEmpty     = $('empty');
  var elInsights  = $('insights');
  var elKpis      = $('kpis');
  var elNarrative = $('narrative');
  var elTable     = $('table');
  var elFetchBtn  = $('fetchBtn');

  // ── Toast helper ───────────────────────────────────────────────────────────
  function toast(msg) {
    var container = $('toast-container');
    if (!container) return;
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    container.appendChild(el);
    setTimeout(function() {
      el.classList.add('toast-out');
      setTimeout(function() {
        if (el.parentNode) el.parentNode.removeChild(el);
      }, 250);
    }, 2000);
  }

  // ── Download helpers ───────────────────────────────────────────────────────
  function downloadBlob(filename, blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function() {
      URL.revokeObjectURL(url);
      if (a.parentNode) a.parentNode.removeChild(a);
    }, 500);
    toast('Downloaded ' + filename);
  }

  function downloadDataURL(filename, dataURL) {
    var a = document.createElement('a');
    a.href = dataURL;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function() {
      if (a.parentNode) a.parentNode.removeChild(a);
    }, 500);
    toast('Downloaded ' + filename);
  }

  // ── Copy helpers ───────────────────────────────────────────────────────────
  function copyText(str) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(str).then(function() {
        toast('Copied');
      }).catch(function() {
        toast('Copy failed');
      });
    } else {
      toast('Copy failed');
    }
  }

  // chartToOpaqueDataURL: composites chartCanvas onto an opaque surface background
  function chartToOpaqueDataURL(chartCanvas) {
    var w = chartCanvas.width;
    var h = chartCanvas.height;
    var tmp = document.createElement('canvas');
    tmp.width = w;
    tmp.height = h;
    var ctx = tmp.getContext('2d');
    ctx.fillStyle = '#14100a';
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(chartCanvas, 0, 0);
    return tmp.toDataURL('image/png');
  }

  function copyCanvasImage(chartCanvas, csvFallbackFn) {
    if (!chartCanvas) { toast('Copy failed'); return; }
    var dataURL = chartToOpaqueDataURL(chartCanvas);
    if (navigator.clipboard && typeof ClipboardItem !== 'undefined') {
      try {
        var parts = dataURL.split(',');
        var byteStr = atob(parts[1]);
        var arr = new Uint8Array(byteStr.length);
        for (var i = 0; i < byteStr.length; i++) { arr[i] = byteStr.charCodeAt(i); }
        var blob = new Blob([arr], { type: 'image/png' });
        navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(function() {
          toast('Copied');
        }).catch(function() {
          // fallback to CSV
          var csv = csvFallbackFn ? csvFallbackFn() : null;
          if (csv) {
            navigator.clipboard.writeText(csv).then(function() { toast('Copied as CSV'); }).catch(function() { toast('Copy failed'); });
          } else {
            toast('Copy failed');
          }
        });
      } catch(e) {
        var csv2 = csvFallbackFn ? csvFallbackFn() : null;
        if (csv2) {
          navigator.clipboard.writeText(csv2).then(function() { toast('Copied as CSV'); }).catch(function() { toast('Copy failed'); });
        } else {
          toast('Copy failed');
        }
      }
    } else {
      var csv3 = csvFallbackFn ? csvFallbackFn() : null;
      if (csv3) {
        navigator.clipboard.writeText(csv3).then(function() { toast('Copied as CSV'); }).catch(function() { toast('Copy failed'); });
      } else {
        toast('Copy failed');
      }
    }
  }

  // ── No-data guard ──────────────────────────────────────────────────────────
  function requireData() {
    if (!payload) { toast('No data yet'); return false; }
    return true;
  }

  // ── Zone code helper ───────────────────────────────────────────────────────
  function zoneSlug() {
    return currentZone.toLowerCase();
  }

  // ── Status helpers ─────────────────────────────────────────────────────────
  function setStatus(text, cls) {
    elStatus.textContent = text;
    elStatus.className   = cls || '';
    elStatus.title = text;
  }

  function showSpinner(show) {
    if (show) {
      var icon = $('fetchIcon');
      if (icon) {
        icon.outerHTML = '<span id="fetchIcon" class="spinner" aria-hidden="true"></span>';
      }
    } else {
      var sp = $('fetchIcon');
      if (sp) {
        sp.outerHTML = '<svg id="fetchIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
      }
    }
  }

  function fmtGeneratedAt(iso) {
    try {
      var d = new Date(iso);
      return d.toLocaleString(undefined, {
        year: 'numeric', month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    } catch (_) {
      return iso || '';
    }
  }

  // ── Zone filter ────────────────────────────────────────────────────────────
  function buildZoneFilter() {
    elZones.innerHTML = '';
    ZONE_ORDER.forEach(function(code) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.setAttribute('role', 'tab');
      btn.className = 'zone-btn';
      btn.textContent = code;
      btn.dataset.zone = code;
      btn.setAttribute('aria-selected', code === currentZone ? 'true' : 'false');
      btn.addEventListener('click', function() { selectZone(code); });
      elZones.appendChild(btn);
    });
  }

  function selectZone(code) {
    currentZone = code;
    sortCol = null;
    sortAsc = true;
    elZones.querySelectorAll('.zone-btn').forEach(function(btn) {
      var sel = btn.dataset.zone === code;
      btn.setAttribute('aria-selected', sel ? 'true' : 'false');
    });
    if (payload) render();
  }

  // ── Show / hide sections ───────────────────────────────────────────────────
  function showData() {
    elEmpty.classList.add('hidden');
    elInsights.classList.remove('hidden');
  }

  function showEmpty() {
    elEmpty.classList.remove('hidden');
    elInsights.classList.add('hidden');
  }

  // ── Category helpers ───────────────────────────────────────────────────────
  function catLabel(c) {
    return c === '(blank)' ? 'Uncategorized' : c;
  }

  function activeCatsFor(z) {
    var byCat = z.by_cat || {};
    var known = (payload.cat_order || []).filter(function(cat) { return cat in byCat; });
    var knownSet = new Set(known);
    var extras = Object.keys(byCat).filter(function(cat) { return !knownSet.has(cat); });
    return known.concat(extras);
  }

  // ── Render KPIs ───────────────────────────────────────────────────────────
  function renderKpis(z) {
    elKpis.innerHTML = '';

    var card1 = makeKpiCard(
      'Total Risks',
      z.total === 0 ? '0' : String(z.total),
      z.total === 0 ? 'No risks identified' : 'across all categories'
    );
    elKpis.appendChild(card1);

    if (z.total > 0 && z.by_domain && z.by_domain.length >= 1) {
      var top2 = z.by_domain.slice(0, 2);
      var top2Names = top2.map(function(pair) { return pair[0]; });
      var top2Pct   = top2.reduce(function(s, pair) { return s + (z.domain_pct[pair[0]] || 0); }, 0);
      var subtitle   = top2Names.join(' + ');
      var card2 = makeKpiCard('Top Domains Combined', top2Pct + '%', subtitle);
      elKpis.appendChild(card2);
    } else {
      elKpis.appendChild(makeKpiCard('Top Domains', '—', 'No domain data'));
    }

    if (z.total > 0 && z.by_cat && Object.keys(z.by_cat).length > 0) {
      var topCat = null, topCount = -1;
      Object.entries(z.by_cat).forEach(function(entry) {
        var cat = entry[0], cnt = entry[1];
        if (cnt > topCount) { topCount = cnt; topCat = cat; }
      });
      var card3 = makeKpiCard(
        'Top Category',
        topCat ? catLabel(topCat) : '—',
        topCat ? (topCount + ' risk' + (topCount !== 1 ? 's' : '')) : 'No data'
      );
      elKpis.appendChild(card3);
    } else {
      elKpis.appendChild(makeKpiCard('Top Category', '—', 'No category data'));
    }
  }

  function makeKpiCard(label, value, sub) {
    var card = document.createElement('div');
    card.className = 'kpi-card';
    var l = document.createElement('div');
    l.className = 'kpi-label';
    l.textContent = label;
    var v = document.createElement('div');
    v.className = 'kpi-value';
    v.textContent = value;
    var s = document.createElement('div');
    s.className = 'kpi-sub';
    s.textContent = sub;
    card.appendChild(l);
    card.appendChild(v);
    card.appendChild(s);
    return card;
  }

  // ── KPI text summary for copy ──────────────────────────────────────────────
  function kpiTextSummary(z) {
    var lines = [];
    lines.push('Total Risks: ' + z.total);
    if (z.total > 0 && z.by_domain && z.by_domain.length >= 1) {
      var top2 = z.by_domain.slice(0, 2);
      var top2Names = top2.map(function(p) { return p[0]; });
      var top2Pct = top2.reduce(function(s, p) { return s + (z.domain_pct[p[0]] || 0); }, 0);
      lines.push('Top Domains Combined: ' + top2Pct + '% (' + top2Names.join(' + ') + ')');
    }
    if (z.total > 0 && z.by_cat && Object.keys(z.by_cat).length > 0) {
      var topCat = null, topCount = -1;
      Object.entries(z.by_cat).forEach(function(e) {
        if (e[1] > topCount) { topCount = e[1]; topCat = e[0]; }
      });
      if (topCat) lines.push('Top Category: ' + catLabel(topCat) + ' (' + topCount + ' risks)');
    }
    return lines.join('\n');
  }

  // ── Render Pie ─────────────────────────────────────────────────────────────
  function renderPie(z) {
    if (pieChart) { pieChart.destroy(); pieChart = null; }
    var labels = (z.by_domain || []).map(function(p) { return p[0]; });
    var data   = (z.by_domain || []).map(function(p) { return p[1]; });
    var colors = labels.map(function(_, i) { return PIE_PALETTE[i % PIE_PALETTE.length]; });
    var sliceBorder = '#14100a';
    var ctx = $('pie').getContext('2d');
    pieChart = new Chart(ctx, {
      type: 'pie',
      data: {
        labels: labels,
        datasets: [{
          data: data,
          backgroundColor: colors,
          borderColor: sliceBorder,
          borderWidth: 2,
          hoverBorderWidth: 3,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'bottom',
            labels: {
              padding: 8,
              boxWidth: 12,
              font: { size: 10, family: '"Fira Sans", system-ui, sans-serif' },
              color: '#c4b79b',
            }
          },
          tooltip: {
            callbacks: {
              label: function(ctx2) {
                var total2 = ctx2.dataset.data.reduce(function(a, b) { return a + b; }, 0);
                var pct = total2 ? Math.round(100 * ctx2.parsed / total2) : 0;
                return ' ' + ctx2.label + ': ' + ctx2.parsed + ' (' + pct + '%)';
              }
            }
          }
        }
      }
    });
  }

  // pie CSV fallback
  function pieCsvData(z) {
    var rows = ['domain,count'];
    (z.by_domain || []).forEach(function(p) { rows.push(csvEscape(p[0]) + ',' + p[1]); });
    return rows.join('\n');
  }

  // ── Render Bar ─────────────────────────────────────────────────────────────
  function renderBar(z) {
    if (barChart) { barChart.destroy(); barChart = null; }
    var domains = (z.by_domain || []).map(function(p) { return p[0]; });
    var activeCats = activeCatsFor(z);
    var datasets = activeCats.map(function(cat) {
      return {
        label: catLabel(cat),
        data: domains.map(function(dom) {
          return (z.crosstab && z.crosstab[dom] && z.crosstab[dom][cat]) || 0;
        }),
        backgroundColor: CAT_COLORS[cat] || '#897c64',
        borderColor: 'transparent',
        borderWidth: 0,
      };
    });
    var ctx = $('bar').getContext('2d');
    barChart = new Chart(ctx, {
      type: 'bar',
      data: { labels: domains, datasets: datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: {
            stacked: true,
            ticks: {
              color: '#897c64',
              font: { size: 9, family: '"Fira Sans", system-ui, sans-serif' },
              maxRotation: 45,
            },
            grid: { color: 'rgba(232,200,16,0.08)' },
          },
          y: {
            stacked: true,
            ticks: {
              color: '#897c64',
              font: { size: 10, family: '"Fira Code", monospace' },
            },
            grid: { color: 'rgba(232,200,16,0.08)' },
          }
        },
        plugins: {
          legend: {
            position: 'top',
            labels: {
              padding: 8,
              boxWidth: 12,
              font: { size: 10, family: '"Fira Sans", system-ui, sans-serif' },
              color: '#c4b79b',
            }
          },
          tooltip: {
            mode: 'index',
            callbacks: {
              footer: function(items) {
                var sum = items.reduce(function(a, i) { return a + i.parsed.y; }, 0);
                return 'Total: ' + sum;
              }
            }
          }
        }
      }
    });
  }

  // bar CSV fallback
  function barCsvData(z) {
    var activeCats = activeCatsFor(z);
    var domains = (z.by_domain || []).map(function(p) { return p[0]; });
    var header = ['domain'].concat(activeCats.map(catLabel)).map(csvEscape).join(',');
    var rows = [header];
    domains.forEach(function(dom) {
      var cells = [csvEscape(dom)].concat(activeCats.map(function(cat) {
        return String((z.crosstab && z.crosstab[dom] && z.crosstab[dom][cat]) || 0);
      }));
      rows.push(cells.join(','));
    });
    return rows.join('\n');
  }

  // ── Render Narrative ───────────────────────────────────────────────────────
  function renderNarrative(z) {
    elNarrative.innerHTML = '';
    var lines = z.narrative || [];
    lines.forEach(function(line) {
      if (line === '' || line === null || line === undefined) {
        var sp = document.createElement('span');
        sp.className = 'narrative-blank';
        sp.setAttribute('aria-hidden', 'true');
        elNarrative.appendChild(sp);
      } else {
        var sp = document.createElement('span');
        sp.className = 'narrative-line';
        // Highlight lines that look like domain headings (e.g. start with a domain name followed by colon)
        if (/^[A-Z][^:]{0,40}:/.test(line)) {
          sp.classList.add('domain-line');
        }
        sp.textContent = line;
        elNarrative.appendChild(sp);
      }
    });
  }

  // ── Render Table ───────────────────────────────────────────────────────────
  function renderTable(z) {
    var thead = elTable.tHead;
    var tbody = elTable.tBodies[0];
    thead.innerHTML = '';
    tbody.innerHTML = '';

    var activeCats = activeCatsFor(z);
    var cols = ['Domain'].concat(activeCats).concat(['Total']);
    var colLabels = ['Domain'].concat(activeCats.map(catLabel)).concat(['Total']);

    var tr = document.createElement('tr');
    cols.forEach(function(col, i) {
      var th = document.createElement('th');
      th.textContent = colLabels[i];
      if (col === 'Total') th.classList.add('total-col');
      var ind = document.createElement('span');
      ind.className = 'sort-indicator';
      ind.setAttribute('aria-hidden', 'true');
      ind.textContent = ' ↕';
      th.appendChild(ind);
      th.setAttribute('aria-sort', 'none');
      th.tabIndex = 0;
      (function(colIdx) {
        th.addEventListener('click', function() { tableSort(colIdx, z, activeCats); });
        th.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            tableSort(colIdx, z, activeCats);
          }
        });
      })(i);
      if (sortCol === i) {
        th.classList.add('sort-active');
        ind.textContent = sortAsc ? ' ↑' : ' ↓';
        th.setAttribute('aria-sort', sortAsc ? 'ascending' : 'descending');
      }
      tr.appendChild(th);
    });
    thead.appendChild(tr);

    var rows = (z.by_domain || []).map(function(entry) {
      var dom = entry[0], domCount = entry[1];
      var cells = [dom].concat(activeCats.map(function(cat) {
        return (z.crosstab[dom] && z.crosstab[dom][cat]) || 0;
      })).concat([domCount]);
      return cells;
    });

    if (sortCol !== null) {
      rows.sort(function(a, b) {
        var av = a[sortCol], bv = b[sortCol];
        var cmp;
        if (typeof av === 'number' && typeof bv === 'number') {
          cmp = av - bv;
        } else {
          cmp = String(av).localeCompare(String(bv));
        }
        return sortAsc ? cmp : -cmp;
      });
    }

    rows.forEach(function(cells) {
      var row = document.createElement('tr');
      cells.forEach(function(val, i) {
        var td = document.createElement('td');
        td.textContent = val;
        if (i === cells.length - 1) td.classList.add('total-col');
        row.appendChild(td);
      });
      tbody.appendChild(row);
    });
  }

  function tableSort(colIdx, z, activeCats) {
    if (sortCol === colIdx) {
      sortAsc = !sortAsc;
    } else {
      sortCol = colIdx;
      sortAsc = colIdx === 0;
      if (colIdx > 0) sortAsc = false;
    }
    renderTable(z);
  }

  // ── CSV/TSV helpers ────────────────────────────────────────────────────────
  function csvEscape(val) {
    var s = String(val === null || val === undefined ? '' : val);
    if (s.indexOf(',') !== -1 || s.indexOf('"') !== -1 || s.indexOf('\n') !== -1) {
      return '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  }

  function tableTsv(z) {
    var activeCats = activeCatsFor(z);
    var header = ['Domain'].concat(activeCats.map(catLabel)).concat(['Total']).join('\t');
    var rows = [header];
    (z.by_domain || []).forEach(function(entry) {
      var dom = entry[0], domCount = entry[1];
      var cells = [dom].concat(activeCats.map(function(cat) {
        return String((z.crosstab[dom] && z.crosstab[dom][cat]) || 0);
      })).concat([String(domCount)]);
      rows.push(cells.join('\t'));
    });
    return rows.join('\n');
  }

  function tableCsv(z) {
    var activeCats = activeCatsFor(z);
    var header = ['Domain'].concat(activeCats.map(catLabel)).concat(['Total']).map(csvEscape).join(',');
    var rows = [header];
    (z.by_domain || []).forEach(function(entry) {
      var dom = entry[0], domCount = entry[1];
      var cells = [csvEscape(dom)].concat(activeCats.map(function(cat) {
        return String((z.crosstab[dom] && z.crosstab[dom][cat]) || 0);
      })).concat([String(domCount)]);
      rows.push(cells.join(','));
    });
    return rows.join('\n');
  }

  function narrativeText(z) {
    return (z.narrative || []).join('\n');
  }

  // ── Main render ───────────────────────────────────────────────────────────
  function render() {
    if (!payload) return;
    var z = payload.zones[currentZone];
    if (!z) return;
    showData();
    // Update zone heading
    var heading = $('zone-heading');
    if (heading) {
      heading.textContent = currentZone + ' — Risk Insights';
    }
    renderKpis(z);
    renderPie(z);
    renderBar(z);
    renderNarrative(z);
    renderTable(z);
  }

  // ── Store payload + set status ─────────────────────────────────────────────
  function applyPayload(p, source) {
    payload = p;
    currentZone = 'Overall';
    sortCol = null;
    sortAsc = true;
    elZones.querySelectorAll('.zone-btn').forEach(function(btn) {
      btn.setAttribute('aria-selected', btn.dataset.zone === 'Overall' ? 'true' : 'false');
    });
    render();
    var n    = p.zones && p.zones[currentZone] ? p.zones[currentZone].total : '?';
    var when = fmtGeneratedAt(p.generated_at);
    var src  = source || p.source || '';
    setStatus('Loaded ' + n + ' risks · ' + when + ' · ' + src, 'loaded');
  }

  var VIEW = 'TPRM Global View';

  // ── Load cached data ───────────────────────────────────────────────────────
  function loadCached() {
    fetch('/api/data').then(function(r) {
      return r.json();
    }).then(function(j) {
      if (j.empty) {
        showEmpty();
        setStatus('Idle — enter credentials and click Fetch', '');
      } else {
        applyPayload(j, 'cache');
      }
    }).catch(function() {
      showEmpty();
      setStatus('Idle', '');
    });
  }

  // ── Fetch button ───────────────────────────────────────────────────────────
  function doFetch() {
    var hostname      = $('hostname').value.trim();
    var client_id     = $('clientId').value.trim();
    var client_secret = $('clientSecret').value;
    var view          = VIEW;

    elFetchBtn.disabled = true;
    showSpinner(true);
    setStatus('Fetching…', 'fetching');

    fetch('/api/fetch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ hostname: hostname, client_id: client_id, client_secret: client_secret, view: view }),
    }).then(function(r) {
      var status = r.status;
      var ok = r.ok;
      return r.text().then(function(text) {
        var j;
        try { j = JSON.parse(text); } catch(_) { j = null; }
        if (!ok || (j && j.error)) {
          var msg = (j && j.error) || ('HTTP ' + status);
          setStatus('Error: ' + msg, 'error');
          return;
        }
        applyPayload(j, (j && j.source) || 'api');
      });
    }).catch(function(e) {
      setStatus('Error: ' + (e.message || 'Network error'), 'error');
    }).finally(function() {
      elFetchBtn.disabled = false;
      showSpinner(false);
    });
  }

  // ── Export button handlers ─────────────────────────────────────────────────
  function setupExportHandlers() {
    // KPIs: copy text, download PNG
    $('kpisCopyBtn').addEventListener('click', function() {
      if (!requireData()) return;
      var z = payload.zones[currentZone];
      copyText(kpiTextSummary(z));
    });

    $('kpisDownloadBtn').addEventListener('click', function() {
      if (!requireData()) return;
      if (typeof html2canvas === 'undefined') { toast('html2canvas not available'); return; }
      var el = $('kpis-wrap');
      var filename = zoneSlug() + '-kpis.png';
      html2canvas(el, { backgroundColor: '#14100a', scale: 2, useCORS: true }).then(function(canvas) {
        downloadDataURL(filename, canvas.toDataURL('image/png'));
      }).catch(function() { toast('Screenshot failed'); });
    });

    // Pie: copy image (CSV fallback), download PNG
    $('pieCopyBtn').addEventListener('click', function() {
      if (!requireData()) return;
      var z = payload.zones[currentZone];
      var canvas = $('pie');
      copyCanvasImage(canvas, function() { return pieCsvData(z); });
    });

    $('pieDownloadBtn').addEventListener('click', function() {
      if (!requireData()) return;
      var canvas = $('pie');
      if (!canvas) { toast('No chart available'); return; }
      var filename = zoneSlug() + '-domain-pie.png';
      downloadDataURL(filename, chartToOpaqueDataURL(canvas));
    });

    // Bar: copy image (CSV fallback), download PNG
    $('barCopyBtn').addEventListener('click', function() {
      if (!requireData()) return;
      var z = payload.zones[currentZone];
      var canvas = $('bar');
      copyCanvasImage(canvas, function() { return barCsvData(z); });
    });

    $('barDownloadBtn').addEventListener('click', function() {
      if (!requireData()) return;
      var canvas = $('bar');
      if (!canvas) { toast('No chart available'); return; }
      var filename = zoneSlug() + '-domain-bar.png';
      downloadDataURL(filename, chartToOpaqueDataURL(canvas));
    });

    // Narrative: copy text, download txt
    $('narrativeCopyBtn').addEventListener('click', function() {
      if (!requireData()) return;
      var z = payload.zones[currentZone];
      copyText(narrativeText(z));
    });

    $('narrativeDownloadBtn').addEventListener('click', function() {
      if (!requireData()) return;
      var z = payload.zones[currentZone];
      var text = narrativeText(z);
      var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      downloadBlob(zoneSlug() + '-narrative.txt', blob);
    });

    // Table: copy TSV, download CSV
    $('tableCopyBtn').addEventListener('click', function() {
      if (!requireData()) return;
      var z = payload.zones[currentZone];
      copyText(tableTsv(z));
    });

    $('tableDownloadBtn').addEventListener('click', function() {
      if (!requireData()) return;
      var z = payload.zones[currentZone];
      var csv = tableCsv(z);
      var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      downloadBlob(zoneSlug() + '-crosstab.csv', blob);
    });

    // Zone screenshot
    $('screenshotBtn').addEventListener('click', function() {
      if (!requireData()) return;
      if (typeof html2canvas === 'undefined') { toast('html2canvas not available'); return; }
      var btn = $('screenshotBtn');
      var origText = btn.innerHTML;
      btn.disabled = true;
      btn.textContent = 'Rendering…';
      var el = $('insights');
      var filename = zoneSlug() + '-dashboard.png';
      html2canvas(el, { backgroundColor: '#0a0806', scale: 2, useCORS: true }).then(function(canvas) {
        downloadDataURL(filename, canvas.toDataURL('image/png'));
      }).catch(function() {
        toast('Screenshot failed');
      }).finally(function() {
        btn.disabled = false;
        btn.innerHTML = origText;
      });
    });
  }

  // ── Init ───────────────────────────────────────────────────────────────────
  function init() {
    buildZoneFilter();
    showEmpty();
    setStatus('Idle', '');

    elFetchBtn.addEventListener('click', doFetch);

    setupExportHandlers();

    loadCached();
  }

  init();

}());
</script>
</body>
</html>
